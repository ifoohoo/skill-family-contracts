version: 0.8.2
date: 2026-08-23
locales:
  en:
    summary: Lockstep patch release for Foundation 0.8.2; the Contracts 1.7.0 machine contract is unchanged.
    changes:
      changed:
        - Moves the package version to 0.8.2 together with Harness and Engineering Kit.
        - Keeps Contracts 1.7.0, all 31 registered top-level object classes, schemas, error codes, and public exports unchanged.
    upgradeNotes: Consumers must pin all three Foundation packages to exactly 0.8.2 before rebuilding a managed Bundle. No Contracts API or specification migration is required from 0.8.1.
  zh-CN:
    summary: 随 Foundation 0.8.2 锁步升版；Contracts 1.7.0 机器合同保持不变。
    changes:
      changed:
        - 包版本与 Harness、Engineering Kit 一同升至 0.8.2。
        - Contracts 1.7.0、31 类顶层对象登记、Schema、错误码和公共导出均保持不变。
    upgradeNotes: 消费者必须把三个 Foundation 包精确锁定到 0.8.2，再重建受管 Bundle；从 0.8.1 升级不需要迁移 Contracts API 或规格。
