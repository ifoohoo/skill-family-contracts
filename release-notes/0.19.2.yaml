version: 0.19.2
date: 2026-09-08
locales:
  en:
    summary: Contracts 0.19.2 aligns its package and exact consumer-vector release coordinates with the Foundation Adoption Review distribution patch. The 1.17.0 specification, public APIs, Schema, capability catalog, and mechanism behavior are unchanged.
    changes:
      changed:
        - Aligns the package version, release documentation, and existing consumer-vector version bindings with Foundation 0.19.2 without changing vector structure or expected behavior.
    upgradeNotes: Pin all three Foundation packages to exactly 0.19.2. This patch adds no Contracts capability and does not change Schema identity, since 0.19.0, or candidate maturity.
  zh-CN:
    summary: Contracts 0.19.2 将包版本和消费者向量的精确发布坐标与 Foundation Adoption Review 分发补丁对齐。Contracts 规格仍为 1.17.0，公开 API、Schema、能力目录和机制行为均不变。
    changes:
      changed:
        - 包版本、发布说明和既有消费者向量的版本绑定与 Foundation 0.19.2 数值对齐；向量结构和预期行为不变。
    upgradeNotes: 三个 Foundation 包须一起精确锁定到 0.19.2。本补丁不增加 Contracts 能力，不改变 Schema 身份、since 0.19.0 或 candidate 成熟度。
