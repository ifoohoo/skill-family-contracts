    changes:
      changed:
        - 同步锁步升至 0.39.1，消费方契约测试向量与正反例夹具对齐 0.39.1 坐标，包主页与双语 README 在线文档入口切换至 https://ifoohoo.github.io/skill-family-foundation-site/。
  en:
    summary: Lockstep 0.39.1 patch release carrying the Contracts 1.22.0 schema surface (including internal dependency resolution receipts, ten-host registry support, and cross-skill-family task handoff envelopes), aligning consumer contract vectors to 0.39.1, and pointing package homepage and README documentation links to the standalone ifoohoo/skill-family-foundation-site site.
    upgradeNotes: Adopt all 0.39.1 release units in lockstep. Existing stable schemas and error codes remain compatible.
    changes:
      changed:
        - Advances package coordinate and consumer contract vectors to 0.39.1 in lockstep and points homepage and bilingual README documentation links to https://ifoohoo.github.io/skill-family-foundation-site/.
