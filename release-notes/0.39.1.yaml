version: 0.39.1
date: 2026-11-25
locales:
  zh-CN:
    summary: 随 Foundation 0.39.1 锁步补丁发布：提供 Contracts 1.22.0 本地契约集合（含内部依赖选版收据、十宿主注册支持与跨技能族任务交接信封），消费方契约测试向量同步对齐 0.39.1，并将包主页与 README 在线文档入口统一切换至独立公开文档站 ifoohoo/skill-family-foundation-site。
