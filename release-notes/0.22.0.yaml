version: 0.22.0
date: 2026-09-18
locales:
  en:
    summary: Contracts 0.22.0 advances the specification from 1.18.0 to 1.20.0 and grows the contract surface from 46 to 53 top-level object classes with multi-path file-set application and recovery plus the governance professional-conclusion object.
    changes:
      added:
        - Adds six file-set objects — file-set-apply-request, file-set-recovery-request, file-set-prune-request, file-set-result, file-set-event-payload, and state-store-recovery-observation — with matching positive, negative, and unsupported-dialect fixtures.
        - Adds the professional-conclusion object with matching fixtures so a caller-owned conclusion can be exchanged with structural-only enforcement.
        - Extends the project-manifest contract with an engineering declaration that references a declared version source and physical entry rather than executing the target.
      changed:
        - Advances the Contracts specification from 1.18.0 to 1.20.0; the nine mandatory rules, error-code ranges, and the Kernel protocol registration are unchanged.
    upgradeNotes: Pin all three Foundation packages to exactly 0.22.0. The new objects are registered as `candidate`; structural validation does not grant business semantics, durable recovery guarantees, or real-host qualification. Consumers own their business plan, candidate re-derivation, and actual consumption verification.
  zh-CN:
    summary: Contracts 0.22.0 把规格从 1.18.0 前移到 1.20.0，顶层合同对象从 46 类增加到 53 类，新增多路径文件集合应用与恢复，以及治理采用的专业结论对象。
    changes:
      added:
        - 新增 file-set-apply-request、file-set-recovery-request、file-set-prune-request、file-set-result、file-set-event-payload、state-store-recovery-observation 六个文件集合对象，并配套正例、负例和方言不支持 fixture。
        - 新增 professional-conclusion 对象及配套 fixture，使调用方持有的结论可以只按结构交换。
        - 扩展 project-manifest 合同，允许工程声明引用已登记的版本来源与物理入口，而不是执行目标。
      changed:
        - Contracts 规格从 1.18.0 前移到 1.20.0；九条 mandatory rule、错误码区间和 Kernel 协议登记保持不变。
    upgradeNotes: 三个 Foundation 包须一起精确锁定到 0.22.0。新增对象仍登记为 `candidate`；结构校验不授予业务语义、持久恢复保证或真实宿主资格。业务计划、候选重新派生和实际消费验证仍由调用方负责。