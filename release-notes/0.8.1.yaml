version: 0.8.1
date: 2026-08-22
locales:
  en:
    summary: Lockstep patch release for the Foundation 0.8 line; the Contracts 1.7.0 machine contract is unchanged.
    changes:
      changed:
        - Moves the package version to 0.8.1 together with Harness and Engineering Kit.
        - Keeps Contracts 1.7.0, all 31 registered top-level object classes, schemas, error codes, and public exports unchanged.
    upgradeNotes: Consumers may pin 0.8.1 to stay on the lockstep Foundation patch line. No Contracts API or specification migration is required from 0.8.0.
  zh-CN:
    summary: 随 Foundation 0.8 补丁线锁步升版；Contracts 1.7.0 机器合同保持不变。
    changes:
      changed:
        - 包版本与 Harness、Engineering Kit 一同升至 0.8.1。
        - Contracts 1.7.0、31 类顶层对象登记、Schema、错误码和公共导出均保持不变。
    upgradeNotes: 消费者可精确锁定 0.8.1，继续使用 Foundation 锁步补丁线；从 0.8.0 升级不需要迁移 Contracts API 或规格。
