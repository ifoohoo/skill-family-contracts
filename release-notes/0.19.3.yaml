    changes:
      changed:
        - 包版本、发布文档和经验证的公开 package.json 投影与 Foundation 0.19.3 数值对齐；契约结构和预期行为不变。
    upgradeNotes: 三个 Foundation 包须一起精确锁定到 0.19.3。本补丁不增加 Contracts 能力，不改变 Schema 身份、since 字段或 candidate 成熟度。
